name: Build

# Сборка под четыре платформы. На тег v* — ещё и черновик релиза с установщиками.
on:
  push:
    branches: [main, "release-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Модель для смоук-теста: самая маленькая, 74 МБ
  TEST_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            slug: macOS-AppleSilicon
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            slug: macOS-Intel
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            slug: Windows-x64
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            slug: Linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # ---------- Системные зависимости ----------

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf libasound2-dev libclang-dev libvulkan-dev file

      - name: Vulkan SDK
        if: runner.os != 'macOS'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # Генератор шейдеров Vulkan в whisper.cpp собирается отдельным под-проектом CMake.
      # С генератором Visual Studio он не находит компилятор, поэтому на Windows
      # собираем через Ninja в окружении разработчика MSVC.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja for CMake
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja -y --no-progress
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # Пути внутри сборки whisper.cpp (вложенный проект шейдеров Vulkan) не
          # влезают в 260 символов Windows, если собирать в D:\a\…\src-tauri\target.
          echo "CARGO_TARGET_DIR=C:/t" >> "$GITHUB_ENV"
          # В Git Bash есть свой /usr/bin/link (unix-утилита) — он перекрывает
          # линкер MSVC, и Rust с CMake пытаются линковать им. Убираем с пути.
          mv "/c/Program Files/Git/usr/bin/link.exe" "/c/Program Files/Git/usr/bin/link.exe.unix" || true
          which -a link || true

      - name: Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-runtime.ps1

      - name: LLVM for bindgen (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - run: npm ci

      # ---------- Смоук-тест: тот же декодер и движок, что в приложении ----------

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: test-model
          key: ggml-tiny-v1

      - name: Download test model
        shell: bash
        run: |
          mkdir -p test-model
          [ -f test-model/ggml-tiny.bin ] || curl -L --fail -o test-model/ggml-tiny.bin "$TEST_MODEL_URL"

      - name: Smoke test (decode + transcribe)
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo build --release --example transcribe --target ${{ matrix.target }} 2>&1 | tee -a ../ci.log
          BIN=${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/examples/transcribe
          for f in ../tests/audio/ru_speech.m4a ../tests/audio/ru_voice_message.ogg; do
            echo "::group::$f"
            "$BIN" ../test-model/ggml-tiny.bin "$f" ru 2>&1 | tee out.txt | tee -a ../ci.log
            echo "::endgroup::"
            grep -q "роверк" out.txt || { echo "::error::no expected text for $f"; exit 1; }
          done

      # Русские модели (GigaAM v3, T-One) через sherpa-onnx: та же нарезка по паузам
      # и тот же код распознавания, что в приложении.
      - name: Cache Russian models
        uses: actions/cache@v4
        with:
          path: test-ru-models
          key: ru-models-gigaam-v3-t-one-v1

      - name: Russian models test
        shell: bash
        run: |
          set -o pipefail
          G=https://huggingface.co/csukuangfj/sherpa-onnx-nemo-transducer-punct-giga-am-v3-russian-2025-12-16/resolve/main
          T=https://huggingface.co/csukuangfj/sherpa-onnx-streaming-t-one-russian-2025-09-08/resolve/main
          mkdir -p test-ru-models/gigaam test-ru-models/t-one
          for f in encoder.int8.onnx decoder.onnx joiner.onnx tokens.txt; do
            [ -f test-ru-models/gigaam/$f ] || curl -sSL --fail -o test-ru-models/gigaam/$f "$G/$f"
          done
          for f in model.onnx tokens.txt; do
            [ -f test-ru-models/t-one/$f ] || curl -sSL --fail -o test-ru-models/t-one/$f "$T/$f"
          done
          BIN=${CARGO_TARGET_DIR:-src-tauri/target}/${{ matrix.target }}/release/examples/transcribe
          for m in gigaam t-one; do
            echo "::group::$m"
            "$BIN" test-ru-models/$m tests/audio/ru_speech.m4a 2>&1 | tee out.txt | tee -a ci.log
            echo "::endgroup::"
            grep -q "роверк" out.txt || { echo "::error::$m: no expected text"; exit 1; }
            grep "от реального" out.txt | sed "s/^/::notice title=$m (${{ matrix.slug }})::/" || true
          done

      # Видео: на macOS и Windows проверяем именно системный декодер (AVFoundation,
      # Media Foundation) без подстраховки ffmpeg; на Linux — запасной путь через ffmpeg.
      - name: Video decoding
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y ffmpeg > /dev/null; else export AURIS_NO_FFMPEG=1; fi
          cargo build --release --example decode --target ${{ matrix.target }} 2>&1 | tee -a ../ci.log
          BIN=${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/examples/decode
          A=../tests/audio
          # Обязательно на всех системах: видео с iPhone (HEVC) и звук 5.1;
          # на Linux через ffmpeg — вообще все тестовые видео
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$BIN" $A/video_*.* 2>&1 | tee -a ../ci.log
          else
            "$BIN" $A/video_hevc_iphone.mov $A/video_aac51.mp4 2>&1 | tee -a ../ci.log
          fi
          # Для сведения (зависит от кодеков системы) — результат видно в аннотациях
          "$BIN" $A/video_ac3.mp4 $A/video_wmv.wmv $A/video_avi_mp3.avi 2>&1 | tee -a ../ci.log | sed 's/^/::notice title=Video (${{ matrix.slug }})::/' || true

      # Диктовка на Linux по-настоящему: виртуальный микрофон PulseAudio, в который
      # проигрывается тестовая фраза; пишет её тот же модуль записи, что в приложении.
      - name: Dictation test (Linux, virtual microphone)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          sudo apt-get install -y pulseaudio pulseaudio-utils libasound2-plugins > /dev/null
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=vmic
          pactl set-default-source vmic.monitor
          ffmpeg -v error -y -i ../tests/audio/ru_speech.m4a -ar 48000 -ac 2 /tmp/speech.wav
          cargo build --release --example record --target ${{ matrix.target }} 2>&1 | tee -a ../ci.log
          BIN=${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/examples/record
          ( sleep 3; paplay --device=vmic /tmp/speech.wav ) &
          "$BIN" 18 ../test-model/ggml-tiny.bin ru 2>&1 | tee out.txt | tee -a ../ci.log
          grep -q "роверк" out.txt || { echo "::error::dictation test: no expected text"; exit 1; }

      # ---------- Сборка установщика ----------

      # Вторая копия приложения без AVX2/FMA/F16C — для старых процессоров
      # (Core 2-го/3-го поколения, Pentium, Celeron). Основная копия сама
      # переключается на неё при запуске, если процессор этих инструкций не знает.
      - name: Compatible build for old CPUs (no AVX2)
        if: runner.os != 'macOS'
        shell: bash
        working-directory: src-tauri
        env:
          AURIS_COMPAT_BUILD: "1"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
          GGML_BMI2: "OFF"
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}-compat"
          cargo build --release --features tauri/custom-protocol --bin auris-whisper --target ${{ matrix.target }} 2>&1 | tee -a ../ci.log
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p binaries
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/auris-whisper$EXT" "binaries/auris-whisper-compat-${{ matrix.target }}$EXT"
          ls -la binaries

      - name: Build app
        shell: bash
        env:
          # Ключ подписи обновлений (секрет репозитория). Без него собираем
          # установщики, но без пакетов для обновления по воздуху.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -o pipefail
          UPDATER=false; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && UPDATER=true
          EXTBIN='[]'; [ "$RUNNER_OS" != "macOS" ] && EXTBIN='["binaries/auris-whisper-compat"]'
          CONF="{\"bundle\":{\"createUpdaterArtifacts\":$UPDATER,\"externalBin\":$EXTBIN}}"
          echo "config override: $CONF"
          build() { npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$CONF" 2>&1 | tee -a ci.log; }
          # На Mac-раннерах hdiutil иногда падает при упаковке DMG («Resource busy») — повторяем.
          build || { [ "$RUNNER_OS" = "macOS" ] && sleep 20 && build; }

      # AppImage должен запускаться, а не падать на старте (свои библиотеки, WebKit).
      - name: Launch test (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb > /dev/null
          APP=$(ls ${CARGO_TARGET_DIR:-src-tauri/target}/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          chmod +x "$APP"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 25 xvfb-run -a "$APP" > launch.log 2>&1
          code=$?
          set -e
          tail -n 25 launch.log
          cat launch.log >> ci.log
          [ $code -eq 124 ] || { echo "::error::AppImage exited early with code $code"; exit 1; }

      - name: Collect installers
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          B=${CARGO_TARGET_DIR:-src-tauri/target}/${{ matrix.target }}/release/bundle
          mkdir -p dist
          N="dist/AurisWhisper-$VERSION-${{ matrix.slug }}"
          # Пакеты обновления по воздуху и их подписи (.sig) — если ключ был задан.
          sig() { for f in "$@"; do [ -f "$f" ] && return 0; done; return 1; }
          case "${{ runner.os }}" in
            macOS)
              cp "$B"/dmg/*.dmg "$N.dmg"
              if sig "$B"/macos/*.app.tar.gz.sig; then
                cp "$B"/macos/*.app.tar.gz "$N.app.tar.gz"
                cp "$B"/macos/*.app.tar.gz.sig "$N.app.tar.gz.sig"
              fi ;;
            Windows)
              cp "$B"/nsis/*-setup.exe "$N-Setup.exe"
              if sig "$B"/nsis/*-setup.exe.sig; then cp "$B"/nsis/*-setup.exe.sig "$N-Setup.exe.sig"; fi ;;
            Linux)
              cp "$B"/appimage/*.AppImage "$N.AppImage"
              cp "$B"/deb/*.deb "$N.deb"
              if sig "$B"/appimage/*.AppImage.sig; then cp "$B"/appimage/*.AppImage.sig "$N.AppImage.sig"; fi ;;
          esac
          ls -la dist

      # Логи Actions без входа в GitHub не читаются, а аннотации — да.
      # Поэтому при падении выносим суть ошибки в аннотации.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          [ -f ci.log ] || exit 0
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-60000; }
          errs=$( { grep -E "error(\[E[0-9]+\])?:|error:|Error:|error C[0-9]{4}|error MSB|CMake Error|No CMAKE_|FAILED|fatal|LNK[0-9]{4}|undefined reference|cannot find|not found|panicked" ci.log || true; } | grep -v "^warning" | tail -n 60 | enc) || true
          echo "::error title=Errors (${{ matrix.slug }})::${errs}"
          echo "::error title=Log tail (${{ matrix.slug }})::$(tail -n 60 ci.log | enc)"

      - uses: actions/upload-artifact@v4
        with:
          name: AurisWhisper-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # latest.json — по нему приложения узнают о новой версии и берут пакет
      # обновления для своей платформы (вместе с подписью).
      - name: Update manifest
        run: |
          python3 - <<'PY'
          import json, os, datetime
          tag = os.environ["GITHUB_REF_NAME"]; version = tag.lstrip("v")
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}/"
          files = {
              "darwin-aarch64": f"AurisWhisper-{version}-macOS-AppleSilicon.app.tar.gz",
              "darwin-x86_64": f"AurisWhisper-{version}-macOS-Intel.app.tar.gz",
              "windows-x86_64": f"AurisWhisper-{version}-Windows-x64-Setup.exe",
              "linux-x86_64": f"AurisWhisper-{version}-Linux-x86_64.AppImage",
          }
          platforms = {}
          for key, name in files.items():
              sig = os.path.join("dist", name + ".sig")
              if os.path.exists(sig):
                  platforms[key] = {"signature": open(sig).read().strip(), "url": base + name}
          if not platforms:
              print("no updater signatures — skipping latest.json"); raise SystemExit
          notes = open("RELEASE_NOTES.md", encoding="utf-8").read() if os.path.exists("RELEASE_NOTES.md") else ""
          manifest = {"version": version, "notes": notes,
                      "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": platforms}
          json.dump(manifest, open("dist/latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps({k: v["url"] for k, v in platforms.items()}, indent=2))
          PY
      - run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Auris Whisper ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
